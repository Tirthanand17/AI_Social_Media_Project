<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow Runner</title><link rel="stylesheet" href="/static/styles.css?v=2.0"></head><body><main class="main-panel"><header class="topbar"><div><p class="eyebrow">Interactive backend runner</p><h1>Run save, schedule, reschedule and review APIs.</h1></div><div class="top-actions"><a class="ghost small" href="/app">Back</a><a class="cta small" href="/docs">Docs</a></div></header><section class="card-grid"><article class="tool-card"><h3>1. Create sample post</h3><button class="cta small" onclick="savePost()">Save sample post</button></article><article class="tool-card"><h3>2. Schedule / reschedule</h3><label>Post ID<input id="postId" type="number" value="1"></label><label>Date<input id="date" type="date"></label><label>Time<input id="time" type="time" value="19:00"></label><button class="cta small" onclick="schedulePost()">Schedule</button><button class="ghost small" onclick="reschedulePost()">Reschedule</button></article><article class="tool-card"><h3>3. Store review</h3><label>Rating<input id="rating" type="number" min="1" max="5" value="5"></label><label>Notes<input id="notes" value="Good hook and CTA"></label><button class="cta small" onclick="saveReview()">Save review</button></article><article class="tool-card wide"><h3>Output</h3><pre id="out">Ready.</pre><button class="ghost small" onclick="historyData()">Load history</button></article></section></main><script>const o=document.getElementById('out');const j=x=>o.textContent=JSON.stringify(x,null,2);async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});j(await r.json())}function id(){return Number(document.getElementById('postId').value||1)}async function savePost(){await post('/api/db/posts',{caption:'AI automation test caption #AI',platform:'Instagram',hashtags:'#AI #Automation',title:'AI Social Studio post',content_type:'reel',created_by:'editor_creator'})}async function schedulePost(){await post('/api/db/schedule',{post_id:id(),scheduled_date:date.value,scheduled_time:time.value,username:'editor_creator'})}async function reschedulePost(){await post('/api/db/reschedule',{post_id:id(),new_date:date.value,new_time:time.value,username:'editor_creator',reason:'Better engagement slot'})}async function saveReview(){await post('/api/db/review',{post_id:id(),platform:'Instagram',caption:'AI automation test caption #AI',rating:Number(rating.value),notes:notes.value,created_by:'editor_creator'})}async function historyData(){const a=await fetch('/api/db/posts').then(r=>r.json());const b=await fetch('/api/db/schedules').then(r=>r.json());const c=await fetch('/api/db/reviews').then(r=>r.json());j({posts:a.posts?.slice(0,5),schedules:b.schedules?.slice(0,5),reviews:c.reviews?.slice(0,5)})}</script></body></html>
